server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    # Django Admin / collectstatic
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # ---------------------------------------------------------------- PWA
    #
    # Service Worker 与 HTML 入口**绝不能**被缓存：
    # 浏览器若把 sw.js 缓存住，它就永远看不到新版本，已安装的 PWA 会一直停在旧代码。
    # index.html 同理 —— 它带着指向旧 hash 资源的引用。
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # workbox 的运行时文件，同样必须每次校验
    location ~ ^/workbox-.+\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Local storage media (STORAGE_BACKEND=local)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tunnel 回源是 HTTP，对外是 HTTPS；强制告诉 Django 是 https。
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA + PWA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
