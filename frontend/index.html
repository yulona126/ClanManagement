<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/claner-icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/claner-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/claner-icon-192.png" />
    <link rel="apple-touch-icon" sizes="360x360" href="/icons/claner-icon-360.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Claner" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="description" content="Claner · 婴儿成长记录博客" />
    <title>Claner</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      主题首帧脚本：必须内联且同步执行，在第一次绘制之前就把 .dark 加上，
      否则深色系统下会先白闪一下。key 必须与 src/features/theme/theme.ts 一致。
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        try {
          var mode = localStorage.getItem('claner:theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) root.classList.add('dark')
          root.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0b0b0b' : '#ffffff')
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛异常，不能让主题脚本搞挂整页 */
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
